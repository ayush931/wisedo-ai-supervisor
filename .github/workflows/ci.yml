name: CI Quality & Test Suite

on:
  # No `paths` filter: every PR must run CI (deploy/, migrations/, workflow
  # changes, etc. previously slipped through untested — main merged untested).
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Static Analysis
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          # The self-hosted runner keeps GOMODCACHE/GOCACHE on disk; restoring
          # the hosted Actions cache only stalls the step until the job timeout.
          cache: false

      - name: Verify Go code formatting (gofmt)
        run: test -z "$(gofmt -l cmd internal)"

      - name: Go static analysis (go vet)
        run: go vet ./...

      - name: Run Go unit and domain tests
        run: go test -v ./internal/... ./cmd/... ./deploy/...

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Build Web UI
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run build

      - name: Verify container build
        run: docker build --tag ghcr.io/wisedo-technology/wisedo-ai-supervisor:ci .
