name: Security & SAST Scans

on:
  # No `paths` filter: every PR must run the security scans (deploy/, migrations/
  # workflow changes previously slipped through untested — main merged untested).
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly automated scan every Monday at 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: SAST & Dependency Vulnerability Audit
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Audit Web dependencies (npm audit)
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web audit --audit-level=high

      # --exclude-dir matches a directory *name*, so "web/node_modules" never
      # excluded anything; scan tracked files only so vendored trees cannot
      # mask or fake a finding. Bare `! cmd` does not fail a bash -e step, so
      # branch on grep's exit status explicitly (0 match, 1 clean, 2 error).
      - name: Secret scan (fail on committed private keys or tokens)
        run: |
          set +e
          git grep -InE "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|aws_secret_access_key|ghp_[A-Za-z0-9]{36}" -- . ':!.github/workflows/security.yml'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then echo "secret scan found blocked pattern" >&2; exit 1; fi
          if [ "$status" -ne 1 ]; then echo "secret scan failed to run (status $status)" >&2; exit 1; fi
